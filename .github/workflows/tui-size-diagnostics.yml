name: TUI size diagnostics

on:
  push:
    branches: [test/ci-windows-tui-size-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Native size diagnostics (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          bun-download-url: ${{ runner.os == 'Windows' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.13/bun-windows-x64-baseline.zip' || '' }}

      # Keep the failing native acceptance build path and versions unchanged.
      - name: Build native test bundle
        working-directory: tui
        run: |
          bun install --frozen-lockfile
          bun run build
          bun scripts/release-notices.ts "${{ matrix.target }}"
          python scripts/package-release.py "${{ matrix.target }}"

      - name: Build base test wheel and install verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir "$RUNNER_TEMP/python-dist"
          python -m pip install --disable-pip-version-check "$(find "$RUNNER_TEMP/python-dist" -name '*.whl' -print -quit)"

      - name: Record exact native sizes and verifier provenance
        run: |
          python -m scripts.tui_size_diagnostics --target "${{ matrix.target }}" \
            --tui-dir tui/dist --report "$RUNNER_TEMP/tui-size-diagnostics.json"

      - name: Run original native wheel verification unchanged
        run: |
          python -m scripts.build_tui_wheels \
            --wheel "$(find "$RUNNER_TEMP/python-dist" -name '*.whl' -print -quit)" \
            --tui-dir tui/dist --target "${{ matrix.target }}" --out-dir "$RUNNER_TEMP/native-wheel"

      # This structured report contains only build metadata, never configs or runtime logs.
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-size-diagnostics-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tui-size-diagnostics.json
          if-no-files-found: warn
          retention-days: 3
